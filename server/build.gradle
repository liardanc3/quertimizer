plugins {
	id 'java'
	id 'idea'
	id 'org.springframework.boot' version '3.5.12'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

sourceSets {
	testUnit {
		java.srcDirs = ['src/test-unit/java']
		resources.srcDirs = ['src/test-unit/resources']
		compileClasspath += sourceSets.main.output
		runtimeClasspath += output + compileClasspath
	}
	testIntegration {
		java.srcDirs = ['src/test-integration/java']
		resources.srcDirs = ['src/test-integration/resources']
		compileClasspath += sourceSets.main.output
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	testUnitCompileOnly {
		extendsFrom testCompileOnly
	}
	testUnitAnnotationProcessor {
		extendsFrom testAnnotationProcessor
	}
	testUnitImplementation {
		extendsFrom testImplementation
	}
	testUnitRuntimeOnly {
		extendsFrom testRuntimeOnly
	}
	testIntegrationCompileOnly {
		extendsFrom testCompileOnly
	}
	testIntegrationAnnotationProcessor {
		extendsFrom testAnnotationProcessor
	}
	testIntegrationImplementation {
		extendsFrom testImplementation
	}
	testIntegrationRuntimeOnly {
		extendsFrom testRuntimeOnly
	}
}

idea {
	module {
		testSources.from(
				file('src/test-unit/java'),
				file('src/test-integration/java')
		)
		testResources.from(
				file('src/test-unit/resources'),
				file('src/test-integration/resources')
		)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	dependsOn tasks.named('unitTest'), tasks.named('integrationTest')
	useJUnitPlatform()
}

tasks.register('unitTest', Test) {
	description = 'Runs unit tests.'
	group = 'verification'
	dependsOn tasks.named('testUnitClasses')
	testClassesDirs = sourceSets.testUnit.output.classesDirs
	classpath = sourceSets.testUnit.runtimeClasspath
	useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
	description = 'Runs integration tests.'
	group = 'verification'
	dependsOn tasks.named('testIntegrationClasses')
	testClassesDirs = sourceSets.testIntegration.output.classesDirs
	classpath = sourceSets.testIntegration.runtimeClasspath
	shouldRunAfter tasks.named('unitTest')
	useJUnitPlatform()
}
