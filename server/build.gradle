plugins {
	id 'java'
	id 'idea'
	id 'org.springframework.boot' version '3.5.12'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.quertimizer'
version = '0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

sourceSets {
	testUnit {
		java.srcDirs = ['src/test-unit/java']
		resources.srcDirs = ['src/test-unit/resources']
		compileClasspath += sourceSets.main.output
		runtimeClasspath += output + compileClasspath
	}
	testIntegration {
		java.srcDirs = ['src/test-integration/java']
		resources.srcDirs = ['src/test-integration/resources']
		compileClasspath += sourceSets.main.output
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	testUnitCompileOnly {
		extendsFrom testCompileOnly
	}
	testUnitAnnotationProcessor {
		extendsFrom testAnnotationProcessor
	}
	testUnitImplementation {
		extendsFrom testImplementation
	}
	testUnitRuntimeOnly {
		extendsFrom testRuntimeOnly
	}
	testIntegrationCompileOnly {
		extendsFrom testCompileOnly
	}
	testIntegrationAnnotationProcessor {
		extendsFrom testAnnotationProcessor
	}
	testIntegrationImplementation {
		extendsFrom testImplementation
	}
	testIntegrationRuntimeOnly {
		extendsFrom testRuntimeOnly
	}
}

idea {
	module {
		testSources.from(
				file('src/test-unit/java'),
				file('src/test-integration/java')
		)
		testResources.from(
				file('src/test-unit/resources'),
				file('src/test-integration/resources')
		)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'org.springframework.session:spring-session-jdbc'

	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.mysql:mysql-connector-j'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	dependsOn tasks.named('unitTest'), tasks.named('integrationTest')
	useJUnitPlatform()
}

tasks.register('unitTest', Test) {
	description = 'Runs unit tests.'
	group = 'verification'
	dependsOn tasks.named('testUnitClasses')
	testClassesDirs = sourceSets.testUnit.output.classesDirs
	classpath = sourceSets.testUnit.runtimeClasspath
	useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
	description = 'Runs integration tests.'
	group = 'verification'
	dependsOn tasks.named('testIntegrationClasses')
	testClassesDirs = sourceSets.testIntegration.output.classesDirs
	classpath = sourceSets.testIntegration.runtimeClasspath
	shouldRunAfter tasks.named('unitTest')
	useJUnitPlatform()
}

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def npmCmd = isWindows ? 'npm.cmd' : 'npm'
def deployTarget = 'quertimizer@server.quertimizer.com'

ext {
	remoteServerBase = '/home/quertimizer/apps/server'
	remoteClientBase = '/home/quertimizer/apps/client'
	remoteServiceName = 'quertimizer-server'
	localClientDir = file('../client')
}

def runCmd = { List<String> cmd, File wd = project.projectDir ->
	println "> ${cmd.join(' ')}"
	exec {
		workingDir wd
		commandLine cmd
	}
}

def newReleaseName = {
	new Date().format('yyyy_MM_dd_HH_mm_ss')
}

tasks.register('deployServer') {
	group = 'deployment'
	dependsOn tasks.named('bootJar')

	doLast {
		def release = newReleaseName()
		def jarFile = tasks.named('bootJar').get().archiveFile.get().asFile

		if (!jarFile.exists()) {
			throw new GradleException("bootJar 결과물이 없음: ${jarFile}")
		}

		runCmd([
				'ssh',
				deployTarget,
				"mkdir -p ${remoteServerBase}/releases/${release}"
		])

		runCmd([
				'scp',
				jarFile.absolutePath,
				"${deployTarget}:${remoteServerBase}/releases/${release}/app.jar"
		])

		runCmd([
				'ssh',
				deployTarget,
				"ln -sfn ${remoteServerBase}/releases/${release} ${remoteServerBase}/current" +
						" && sudo -n systemctl restart ${remoteServiceName}" +
						" && sudo -n systemctl status ${remoteServiceName} --no-pager"
		])
	}
}

tasks.register('deployClient') {
	group = 'deployment'

	doLast {
		def release = newReleaseName()
		def distDir = new File(localClientDir, 'dist')

		if (!localClientDir.exists()) {
			throw new GradleException("client 디렉토리 없음: ${localClientDir}")
		}

		runCmd([npmCmd, 'run', 'build'], localClientDir)

		if (!distDir.exists()) {
			throw new GradleException("client build 결과물 없음: ${distDir}")
		}

		runCmd([
				'ssh',
				deployTarget,
				"mkdir -p ${remoteClientBase}/releases/${release}"
		])

		runCmd([
				'scp',
				'-r',
				new File(distDir, '.').absolutePath,
				"${deployTarget}:${remoteClientBase}/releases/${release}/"
		])

		runCmd([
				'ssh',
				deployTarget,
				"ln -sfn ${remoteClientBase}/releases/${release} ${remoteClientBase}/current" +
						" && sudo -n nginx -t" +
						" && sudo -n systemctl reload nginx"
		])
	}
}

tasks.register('deployAll') {
	group = 'deployment'
	dependsOn tasks.named('deployServer'), tasks.named('deployClient')
}

tasks.named('deployClient') {
	mustRunAfter tasks.named('deployServer')
}
