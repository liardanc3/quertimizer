spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: quertimizer
        format_sql: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
      schema: classpath:schema-session-postgresql.sql

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS}
    username: ${SPRING_ELASTICSEARCH_USERNAME}
    password: ${SPRING_ELASTICSEARCH_PASSWORD}
    connection-timeout: 5s
    socket-timeout: 30s
    restclient:
      ssl:
        bundle: elasticsearch-prod

  ssl:
    bundle:
      pem:
        elasticsearch-prod:
          truststore:
            certificate: ${ELASTICSEARCH_CA_CERT}

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/login/{registrationId}"

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/{registrationId}"

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/{registrationId}"
            scope:
              - account_email
            client-name: Kakao
            provider: kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        mime:
          charset: UTF-8

app:
  frontend-base-url: ${FRONTEND_BASE_URL}
  mail:
    from: ${MAIL_FROM}

judge:
  dataset-provisioning:
    strategy: ${JUDGE_DATASET_PROVISIONING_STRATEGY:sql-replay}
  databases:
    - id: ${JUDGE_POSTGRESQL_WORKER_1_ID:pg-worker-1}
      name: ${JUDGE_POSTGRESQL_WORKER_1_NAME:pg-worker-1}
      engine: postgresql
      url: ${JUDGE_POSTGRESQL_WORKER_1_URL:}
      username: ${JUDGE_POSTGRESQL_WORKER_1_USERNAME:}
      password: ${JUDGE_POSTGRESQL_WORKER_1_PASSWORD:}
      enabled: ${JUDGE_POSTGRESQL_WORKER_1_ENABLED:true}
      max-concurrency: ${JUDGE_POSTGRESQL_WORKER_1_MAX_CONCURRENCY:1}
    - id: ${JUDGE_MYSQL_WORKER_1_ID:mysql-worker-1}
      name: ${JUDGE_MYSQL_WORKER_1_NAME:mysql-worker-1}
      engine: mysql
      url: ${JUDGE_MYSQL_WORKER_1_URL:}
      username: ${JUDGE_MYSQL_WORKER_1_USERNAME:}
      password: ${JUDGE_MYSQL_WORKER_1_PASSWORD:}
      enabled: ${JUDGE_MYSQL_WORKER_1_ENABLED:true}
      max-concurrency: ${JUDGE_MYSQL_WORKER_1_MAX_CONCURRENCY:1}
