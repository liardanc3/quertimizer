spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: quertimizer
        format_sql: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
      schema: classpath:schema-session-postgresql.sql

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS}
    username: ${SPRING_ELASTICSEARCH_USERNAME}
    password: ${SPRING_ELASTICSEARCH_PASSWORD}
    connection-timeout: 5s
    socket-timeout: 30s
    restclient:
      ssl:
        bundle: elasticsearch-prod

  ssl:
    bundle:
      pem:
        elasticsearch-prod:
          truststore:
            certificate: ${ELASTICSEARCH_CA_CERT}

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/login/{registrationId}"

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/{registrationId}"

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/{registrationId}"
            scope:
              - account_email
            client-name: Kakao
            provider: kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        mime:
          charset: UTF-8

app:
  frontend-base-url: ${FRONTEND_BASE_URL}
  mail:
    from: ${MAIL_FROM}
  community:
    image-storage-path: /home/quertimizer/apps/server/image
  security:
    remember-me:
      key: ${QUERTIMIZER_REMEMBER_ME_KEY}
      validity: 90d
      secure: true
      same-site: Lax
    client-ip:
      trust-forwarded-headers: false
      trusted-proxies: []
  logging:
    api:
      include-bodies: false

server:
  forward-headers-strategy: framework

judge:
  runtime:
    provisioner: lvm-snapshot
    lvm-snapshot:
      mount-root: /mnt/sqljudge
      volume-group: vg_sqljudge
      thin-pool: pool
      base-template-version: base
      command-timeout-seconds: 60
      startup-timeout-seconds: 30
  databases:
    - id: pg-worker-1
      name: pg-worker-1
      engine: postgresql
      url: ${SQL_JUDGE_POSTGRESQL_WORKER_1_URL:}
      username: ${SQL_JUDGE_POSTGRESQL_WORKER_1_USERNAME:}
      password: ${SQL_JUDGE_POSTGRESQL_WORKER_1_PASSWORD:}
      runner-container: judge-postgres-1
      runtime-host: 127.0.0.1
      runtime-port-start: 56000
      runtime-port-end: 56049
      runtime-database-name: postgres
      enabled: true
      max-concurrency: 1
    - id: pg-worker-2
      name: pg-worker-2
      engine: postgresql
      url: ${SQL_JUDGE_POSTGRESQL_WORKER_2_URL:}
      username: ${SQL_JUDGE_POSTGRESQL_WORKER_2_USERNAME:}
      password: ${SQL_JUDGE_POSTGRESQL_WORKER_2_PASSWORD:}
      runner-container: judge-postgres-2
      runtime-host: 127.0.0.1
      runtime-port-start: 56050
      runtime-port-end: 56099
      runtime-database-name: postgres
      enabled: true
      max-concurrency: 1
    - id: mysql-worker-1
      name: mysql-worker-1
      engine: mysql
      url: ${SQL_JUDGE_MYSQL_WORKER_1_URL:}
      username: ${SQL_JUDGE_MYSQL_WORKER_1_USERNAME:}
      password: ${SQL_JUDGE_MYSQL_WORKER_1_PASSWORD:}
      runner-container: judge-mysql-1
      runtime-host: 127.0.0.1
      runtime-port-start: 57000
      runtime-port-end: 57049
      runtime-database-name:
      root-password: ${SQL_JUDGE_MYSQL_WORKER_1_ROOT_PASSWORD:${SQL_JUDGE_MYSQL_WORKER_1_PASSWORD:}}
      enabled: true
      max-concurrency: 1
    - id: mysql-worker-2
      name: mysql-worker-2
      engine: mysql
      url: ${SQL_JUDGE_MYSQL_WORKER_2_URL:}
      username: ${SQL_JUDGE_MYSQL_WORKER_2_USERNAME:}
      password: ${SQL_JUDGE_MYSQL_WORKER_2_PASSWORD:}
      runner-container: judge-mysql-2
      runtime-host: 127.0.0.1
      runtime-port-start: 57050
      runtime-port-end: 57099
      runtime-database-name:
      root-password: ${SQL_JUDGE_MYSQL_WORKER_2_ROOT_PASSWORD:${SQL_JUDGE_MYSQL_WORKER_2_PASSWORD:}}
      enabled: true
      max-concurrency: 1
