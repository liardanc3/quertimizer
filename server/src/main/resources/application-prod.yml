spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: quertimizer
        format_sql: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
      schema: classpath:schema-session-postgresql.sql

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS}
    username: ${SPRING_ELASTICSEARCH_USERNAME}
    password: ${SPRING_ELASTICSEARCH_PASSWORD}
    connection-timeout: 5s
    socket-timeout: 30s
    restclient:
      ssl:
        bundle: elasticsearch-prod

  ssl:
    bundle:
      pem:
        elasticsearch-prod:
          truststore:
            certificate: ${ELASTICSEARCH_CA_CERT}

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/login/{registrationId}"

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/{registrationId}"

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/{registrationId}"
            scope:
              - account_email
            client-name: Kakao
            provider: kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        mime:
          charset: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  frontend-base-url: ${FRONTEND_BASE_URL}
  mail:
    from: ${MAIL_FROM}
  community:
    image-storage-path: /home/quertimizer/apps/server/image
  security:
    remember-me:
      key: ${QUERTIMIZER_REMEMBER_ME_KEY}
      validity: 180d
      secure: true
      same-site: Lax
    client-ip:
      trust-forwarded-headers: false
      trusted-proxies: []
  logging:
    api:
      include-bodies: false

server:
  servlet:
    session:
      timeout: 180d
  forward-headers-strategy: framework

judge:
  statistics:
    postgresql:
      default-statistics-target: ${JUDGE_POSTGRESQL_DEFAULT_STATISTICS_TARGET:100}
    mysql:
      innodb-stats-persistent-sample-pages: ${JUDGE_MYSQL_INNODB_STATS_PERSISTENT_SAMPLE_PAGES:8192}
  secrets:
    JUDGE_POSTGRESQL_NODE_1_URL: ${JUDGE_POSTGRESQL_NODE_1_URL:}
    JUDGE_POSTGRESQL_NODE_1_USERNAME: ${JUDGE_POSTGRESQL_NODE_1_USERNAME:}
    JUDGE_POSTGRESQL_NODE_1_PASSWORD: ${JUDGE_POSTGRESQL_NODE_1_PASSWORD:}
    JUDGE_POSTGRESQL_NODE_2_URL: ${JUDGE_POSTGRESQL_NODE_2_URL:}
    JUDGE_POSTGRESQL_NODE_2_USERNAME: ${JUDGE_POSTGRESQL_NODE_2_USERNAME:}
    JUDGE_POSTGRESQL_NODE_2_PASSWORD: ${JUDGE_POSTGRESQL_NODE_2_PASSWORD:}
    JUDGE_POSTGRESQL_NODE_3_URL: ${JUDGE_POSTGRESQL_NODE_3_URL:}
    JUDGE_POSTGRESQL_NODE_3_USERNAME: ${JUDGE_POSTGRESQL_NODE_3_USERNAME:}
    JUDGE_POSTGRESQL_NODE_3_PASSWORD: ${JUDGE_POSTGRESQL_NODE_3_PASSWORD:}
    JUDGE_MYSQL_NODE_1_URL: ${JUDGE_MYSQL_NODE_1_URL:}
    JUDGE_MYSQL_NODE_1_USERNAME: ${JUDGE_MYSQL_NODE_1_USERNAME:}
    JUDGE_MYSQL_NODE_1_PASSWORD: ${JUDGE_MYSQL_NODE_1_PASSWORD:}
    JUDGE_MYSQL_NODE_1_ROOT_PASSWORD: ${JUDGE_MYSQL_NODE_1_ROOT_PASSWORD:${JUDGE_MYSQL_NODE_1_PASSWORD:}}
    JUDGE_MYSQL_NODE_2_URL: ${JUDGE_MYSQL_NODE_2_URL:}
    JUDGE_MYSQL_NODE_2_USERNAME: ${JUDGE_MYSQL_NODE_2_USERNAME:}
    JUDGE_MYSQL_NODE_2_PASSWORD: ${JUDGE_MYSQL_NODE_2_PASSWORD:}
    JUDGE_MYSQL_NODE_2_ROOT_PASSWORD: ${JUDGE_MYSQL_NODE_2_ROOT_PASSWORD:${JUDGE_MYSQL_NODE_2_PASSWORD:}}
    JUDGE_MYSQL_NODE_3_URL: ${JUDGE_MYSQL_NODE_3_URL:}
    JUDGE_MYSQL_NODE_3_USERNAME: ${JUDGE_MYSQL_NODE_3_USERNAME:}
    JUDGE_MYSQL_NODE_3_PASSWORD: ${JUDGE_MYSQL_NODE_3_PASSWORD:}
    JUDGE_MYSQL_NODE_3_ROOT_PASSWORD: ${JUDGE_MYSQL_NODE_3_ROOT_PASSWORD:${JUDGE_MYSQL_NODE_3_PASSWORD:}}
