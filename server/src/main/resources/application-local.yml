spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=quertimizer
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: quertimizer
        format_sql: true
